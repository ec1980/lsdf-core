name: Update L-SDF Indices

on:
  push:

permissions:
  contents: write

jobs:
  update-lsdf:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install lsdf
        run: python -m pip install lsdf-core

      - name: Regenerate indices
        run: lsdf gen . --recursive

      - name: Commit updated indices
        run: |
          git add $(find . -name "*.lsdf" -not -path "./.git/*")

          if git diff --cached --quiet; then
            echo "No index changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update L-SDF indices"
          git push
