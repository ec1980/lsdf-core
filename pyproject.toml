[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lsdf-core"
version = "1.1.1"
description = "Token-optimized documentation generator for AI Agents"
dependencies = [
    "click>=8.0",
]

[project.scripts]
lsdf = "src.cli:main"

# --- BUILD CONFIGURATION ---

[tool.hatch.build.targets.wheel]
packages = ["src"]
# Includes the .lsdf folder in the distribution
artifacts = [".lsdf"]
